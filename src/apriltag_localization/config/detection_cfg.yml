# config/my_node_params.yaml
apriltag_node:
  ros__parameters:
    # 订阅话题：/{topic_prefix}/{stream}/...（与 video_camera topic_prefix 一致）
    camera_info_topic: "/camera_back_video/color/camera_info"
    image_topic: "/camera_back_video/color/image_raw"
    detection_objects_topic: "/apriltag_node/detections"  # 输出topic，类型 m_common::msg::DetectionObjList
    # TF parent / DetectionObjList.header.frame_id：须为相机 ROS link（非 optical）
    # 节点内会做 optical→link（camera2camera_link）；须与 URDF camera_back_video_link 一致
    frame_id: camera_back_video_link
    dock_frame_id: dock_frame                              # 融合船坞 TF child；逐 tag 为 {dock_frame_id}_tag_{id}
    apriltag_family_name: tag36h11 # AprilTag的类型，tag36h11、tag25h9、tagCircle21h7、tagCircle49h12、tagStandard41h12、tagStandard52h13、tagCustom48h12
    tag_size: 0.25 # AprilTag码的实际物理尺寸，单位为m
    tag_ids: [0,1] # tag码的唯一ID号，int类型，可自定义配置 tag_ids，支持多个，最少配置一个码
    #参数命名必须包含 tag_{tag_id}码配置船坞至二维码的距离/角度参数
    tag_0: # tag id为0的二维码中心至船坞中心的距离/角度参数
      dock_offset_x: 0.0 #单位m
      dock_offset_y: -0.75 #单位m
      dock_offset_z: -0.2 #单位m
      dock_offset_roll: 0.0 #单位:度
      dock_offset_pitch: 0.0 #单位:度
      dock_offset_yaw: 0.0 #单位:度
    tag_1: # tag id为1的的二维码中心至船坞中心的距离/角度参数
      dock_offset_x: 0.0 #单位m
      dock_offset_y: 0.75 #单位m
      dock_offset_z: -0.2 #单位m
      dock_offset_roll: 0.0 #单位:度
      dock_offset_pitch: 0.0 #单位:度
      dock_offset_yaw: 0.0 #单位角:度
