tf_docking_node:
  ros__parameters:
    # ============================================================
    # 坐标系与话题
    # ============================================================
    dock_frame: "dock_frame"           # AprilTag 广播的船坞坐标系
    robot_frame: "base_link"           # 船体坐标系
    cmd_vel_topic: "/cmd_vel_nav"      # 速度指令输出
    start_topic: "/dock/start"         # 归港启动信号 (Bool)
    cancel_topic: "/dock/cancel"       # 归港取消信号 (Empty)
    status_topic: "/dock/status"       # 状态输出 (JSON String)
    odom_topic: "/odometry/filtered"   # 里程计 (方位推算)

    # ============================================================
    # TF 质量判断
    # ============================================================
    tf_max_age_sec: 0.3                # TF 时间戳超过此值视为 STALE (s)
    tf_max_age_back_in_sec: 0.2        # BACK_IN/CORRECTING 阶段更严格 (s)
    tf_jump_threshold_m: 1.0           # 相邻帧位移超过此值视为 JUMP (m)
    tf_min_range_m: 0.3                # 距离小于此值视为 OUT_OF_RANGE (m)
    tf_max_range_m: 30.0               # 距离大于此值视为 OUT_OF_RANGE (m)

    # ============================================================
    # 位姿滤波
    # ============================================================
    pose_filter_alpha: 0.35            # EMA 低通系数, 越小越平滑
    yaw_outlier_reject_rad: 1.5        # 单帧 yaw 跳变超过此值则丢弃 (rad)

    # ============================================================
    # 船坞几何
    # ============================================================
    entry_heading_rad: 3.141592653589793  # 对准时的目标航向 (rad), π=倒泊船头朝外

    # ============================================================
    # ACQUIRE_TAG — 初始等待 TF 稳定
    # ============================================================
    acquire_cycles: 5                  # 连续 GOOD 帧数达标后进入 RECORD_POSE
    acquire_timeout_sec: 5.0           # 超时未获取 → SEARCH_TAG

    # ============================================================
    # SEARCH_TAG — 定向搜索 (方向锁定，看到tag减速不反转)
    # ============================================================
    search_spin_speed: 0.35            # 盲转搜索角速度 (rad/s)
    search_kyaw: 0.40                  # 有TF时航向伺服增益 (w = -kyaw * heading_err)
    search_timeout_sec: 90.0           # 搜索总超时 (s)
    search_angle_rad: 6.283185307      # 转满此角度仍无 tag → 反向重试 (rad, 2π)
    search_confirm_frames: 2           # 搜索中连续 GOOD 帧数 → 确认找到
    search_dwell_sec: 1.0              # 丢失后保持惯性的时间 (s)
    search_servo_gain: 0.5             # 丢失后里程计方位伺服增益
    max_search_retries: 2              # 全圈无 tag 后反向重试次数

    # ============================================================
    # RECORD_POSE — 记录初始位姿, 安全检查
    # ============================================================
    max_lateral_offset_m: 10.0          # |y| 超过此值 → ABORT+reapproach (m)
    max_heading_offset_rad: 3.0        # |heading_error| 超过此值 → ABORT+reapproach (rad)

    # ============================================================
    # APPROACH_ALIGN — bearing 弧线接近（向基线凹）
    # ============================================================
    approach_speed: 0.30               # 恒速倒车巡航速度 (m/s)
    approach_kyaw: 0.40                # bearing 航向修正增益
    approach_entry_x_m: 5.0            # 距坞中心(Tag)小于此值 → 切入 ALIGN 精调 (m)
    approach_timeout_sec: 90.0         # 超时 → ABORT (s)

    # ============================================================
    # ALIGN — 原地/低速精调 y 和 yaw
    # ============================================================
    align_ky: 0.20                     # 横向修正增益
    align_kyaw: 0.40                   # 航向修正增益
    align_y_tol_m: 0.10                # |y| 达标阈值 (m)
    align_yaw_tol_rad: 0.08            # |heading_error| 达标阈值 (rad, ≈4.6°)
    align_settle_cycles: 5             # 连续达标帧数 → 进入 BACK_IN
    align_creep_speed: 0.08            # 航向误差小时低速倒车蠕动 (m/s)
    align_creep_yaw_rad: 0.26          # 航向误差小于此值才允许蠕动 (rad, ≈15°)
    align_timeout_sec: 45.0            # 超时 → ABORT (s)

    # ============================================================
    # BACK_IN — 沿中轴线倒车入坞
    # ============================================================
    back_in_kx: 0.15                   # 纵向速度增益, v = kx * remaining
    back_in_ky: 0.20                   # 横向修正增益
    back_in_kyaw: 0.40                 # 航向修正增益
    back_in_max_speed: 0.30            # 最大倒车速度 (m/s)
    back_in_min_speed: 0.05            # 最小倒车速度 (m/s)
    back_in_corridor_y_m: 0.30         # 走廊横向边界, 超限 → CORRECTING (m)
    back_in_corridor_yaw_rad: 0.26     # 走廊航向边界 (rad, ≈15°)
    back_in_corridor_cycles: 10        # 连续超限帧数 → 触发 CORRECTING
    back_in_timeout_sec: 90.0          # 超时 → ABORT (s)

    # BACK_IN 盲倒 — 近距离丢 tag 是正常现象(相机已看不到 tag)
    back_in_blind_depth_m: 1.5         # depth < 此值时丢 tag → 盲倒而非搜索 (m)
    back_in_blind_speed: 0.05          # 盲倒速度, 低速直退 (m/s)
    back_in_blind_timeout_sec: 15.0    # 盲倒超时 → 视为已停靠 (s)

    # ============================================================
    # CORRECTING — BACK_IN 中偏离走廊后原地修正
    # ============================================================
    correct_timeout_sec: 30.0          # 单次修正超时 (s)
    correct_max_retries: 2             # 最大修正次数, 超过 → ABORT
    correct_creep_speed: 0.03          # 保持最低倒车速度维持舵效 (m/s)

    # ============================================================
    # DOCKED 判定阈值
    # ============================================================
    stop_x_m: 0.30                     # |x| < 此值视为到位 (m)
    stop_y_m: 0.15                     # |y| < 此值视为对准 (m)
    stop_yaw_rad: 0.08                 # |heading_error| < 此值视为对准 (rad)

    # ============================================================
    # Tag 丢失处理
    # ============================================================
    tag_loss_hold_sec: 5.0             # 里程计伺服超过此时间 → 进入 SEARCH_TAG (s)

    # ============================================================
    # 全局限制
    # ============================================================
    max_docking_duration_sec: 240.0    # 整个归港会话最大时长 (s)
    max_yaw_rate: 0.30                 # 最大角速度 (rad/s)
    max_reverse_speed: 0.50            # 最大倒车速度 (m/s)
