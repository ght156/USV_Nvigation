# -----------------------------------------------------------------------------
#
# 里程计 / TF：
#   - odom→base_link：NX gps_input 插件（inspvaa 时间戳）
#   - map→odom：gnss_odom_map_tf（real_boat_bringup），时间戳跟随 RTK（inspvaa），
#     与 odom→base_link 同源；map_server 用同一份 map.yaml
#   - 各 odom_topic 统一为 /mavros/gps_input/local
#
# 速度链：controller_server → /cmd_vel_nav → ardupilot_velocity_bridge
#   → /mavros/setpoint_velocity/cmd_vel_unstamped
#   （桥只做转发/超时归零/限速；切模式与解锁由外部负责，桥不再接管）
#
# RPP 前瞻 L≈clamp(v×lookahead_time, min, max)：
#   min 过小 → carrot 在转弯半径内侧 → S 线/震荡；max 过大 → 先冲远再拐（目标在船后明显）
#   min 宜 ≥ 船头前伸(2.72m) 且 ≥ 最小转弯半径（见 regulated_linear_scaling_min_radius）
#
# 保守下水：速度与 ardupilot_velocity_bridge 的 max_linear_x / max_angular_z 同量级，先小后大。
# Livox：/livox/lidar；footprint 见 local/global costmap 注释。
# -----------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map              # 与 global_costmap、规划目标一致，固定 map
    robot_base_frame: base_link   # gps_input/local odom 子帧
    odom_topic: "/mavros/gps_input/local"  # 与 mission_bridge、velocity_smoother、速度桥一致
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names: [
      nav2_compute_path_to_pose_action_bt_node, nav2_compute_path_through_poses_action_bt_node,
      nav2_smooth_path_action_bt_node, nav2_follow_path_action_bt_node, nav2_spin_action_bt_node,
      nav2_wait_action_bt_node, nav2_assisted_teleop_action_bt_node, nav2_back_up_action_bt_node,
      nav2_drive_on_heading_bt_node, nav2_clear_costmap_service_bt_node, nav2_is_stuck_condition_bt_node,
      nav2_goal_reached_condition_bt_node, nav2_goal_updated_condition_bt_node, nav2_globally_updated_goal_condition_bt_node,
      nav2_is_path_valid_condition_bt_node, nav2_initial_pose_received_condition_bt_node,
      nav2_reinitialize_global_localization_service_bt_node, nav2_rate_controller_bt_node,
      nav2_distance_controller_bt_node, nav2_speed_controller_bt_node, nav2_truncate_path_action_bt_node,
      nav2_truncate_path_local_action_bt_node, nav2_goal_updater_node_bt_node, nav2_recovery_node_bt_node,
      nav2_pipeline_sequence_bt_node, nav2_round_robin_node_bt_node, nav2_transform_available_condition_bt_node,
      nav2_time_expired_condition_bt_node, nav2_path_expiring_timer_condition, nav2_distance_traveled_condition_bt_node,
      nav2_single_trigger_bt_node, nav2_goal_updated_controller_bt_node, nav2_is_battery_low_condition_bt_node,
      nav2_navigate_through_poses_action_bt_node, nav2_navigate_to_pose_action_bt_node,
      nav2_remove_passed_goals_action_bt_node, nav2_planner_selector_bt_node, nav2_controller_selector_bt_node,
      nav2_goal_checker_selector_bt_node, nav2_controller_cancel_bt_node, nav2_path_longer_on_approach_bt_node,
      nav2_wait_cancel_bt_node, nav2_spin_cancel_bt_node, nav2_back_up_cancel_bt_node,
      nav2_assisted_teleop_cancel_bt_node, nav2_drive_on_heading_cancel_bt_node, nav2_is_battery_charging_condition_bt_node
    ]

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false 

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false 

controller_server:
  ros__parameters:
    use_sim_time: false
    # —— 控制器订阅的里程计话题（只取 twist 速度反馈，不取位姿；缺省为 /odom）——
    odom_topic: "/mavros/gps_input/local"
    # —— 控制器频率 (Hz)。20 为 Nav2 默认；水面扭动大时可试 10，与 smoothing_frequency 对齐 ——
    controller_frequency: 20.0
    # —— 里程计反馈噪声门限：odom twist 低于此值视为 0（作用于喂给控制器的速度反馈，
    #    见 controller_server.hpp getThresholdedTwist；不是输出指令死区）——
    # 设近默认值：GPS/INS 反馈静止时本就接近 0，无编码器漂移可滤；
    # 0.05 会把真实慢速运动清零，导致原地旋转爬坡死锁（实测教训）——
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # —— 在 movement_time_allowance 秒内至少移动 required_movement_radius 米，否则视为卡住 ——
      required_movement_radius: 2.0
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # —— 到达判定容差：xy (米) / yaw (弧度) ——
      xy_goal_tolerance: 2.0
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # —— 期望线速度 (m/s)。下水首试偏保守 (0.2)；稳定后可逐步放宽 ——
      desired_linear_vel: 0.5
      # —— 角加速度上限 (rad/s²)，只用于原地旋转的爬坡：每周期 ω 最多变化 a×dt（2.0×0.05=0.1）。
      #    首步指令须越过船的物理静摩擦死区，否则配合反馈钳位会卡死（0.3 时实测死锁）；
      #    爬坡基准是里程计反馈角速度，故 min_theta_velocity_threshold 不可设大。
      #    输出侧另有桥的变化率限制(0.35 rad/s²)兜底，此处放开不会失控 ——
      max_angular_accel: 2.0
      # —— 是否允许倒车。false：目标在船后时只能绕弧前进，无法倒车对准；全局路径会先向前再拐 ——
      allow_reversing: false #与原地旋转不能同时开启

      # —— 前瞻 (lookahead / carrot)，L≈clamp(v×lookahead_time, min, max) ——
      # base_link 在船尾、船头前伸约 1.4 m：min 须 >1.4，否则 carrot 落在船体内。
      # 与最小转弯半径 R_min 匹配（宜 min ≥ R_min，与 regulated_linear_scaling_min_radius 同量级）：
      #   min 过小：carrot 在弯内侧，船未转完前瞻点已到近处 → S 线、左右震荡，严重时像反向拧。
      #   max 过大：沿路径直行过久 → 转弯滞后、有效半径大，目标在船后时先冲很远再拐。
      lookahead_dist: 10.0                    # 静态Fallback距离，use_velocity_scaled_lookahead_dist: true时无效
      lookahead_time: 16.0
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 5.0
      max_lookahead_dist: 8.0

      # —— 曲率限速：路径转弯半径 < min_radius 时线速度向 min_speed 靠拢 ——
      # min_radius 宜与船体最小转弯半径、min_lookahead_dist 同量级；过小 → 频繁压到 min_speed 走走停停
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.1       # 急弯最低速；过小舵效差易画圈，可试 0.2~0.3.不能低到船舵效明显失效
      regulated_linear_scaling_min_radius: 5.0       # 触发减速的等效转弯半径 (m)

      # —— 代价减速（软限速，与碰撞弧急停是两套独立机制）——
      # 由船位代价按膨胀衰减公式反算"到最近障碍距离" d；d < cost_scaling_dist 时
      #   速度 ×= cost_scaling_gain × d / cost_scaling_dist
      # gain=1.0 即线性：5m 全速、2.5m 半速、贴障趋于 min_speed。只管"提前慢"，不管停。
      use_cost_regulated_linear_velocity_scaling: true
      # 开始减速的距离门槛 (m)；须 ≤ local inflation_radius（已对齐 5.0），超出膨胀范围代价为 0 不生效
      cost_scaling_dist: 5.0
      cost_scaling_gain: 1.0        # 减速强度：1.0 线性比例；调小更保守（同距离给速更少）
      # 反算距离用的膨胀衰减系数，须与 local_costmap 膨胀层 cost_scaling_factor 一致（已对齐 1.0）
      inflation_cost_scaling_factor: 1.0

      # —— 接近目标时减速。距离须 ≥ 船头前伸量，否则到达前已全速冲过 ——
      min_approach_linear_velocity: 0.0
      approach_velocity_scaling_dist: 5.0   #剩余路径长度小于此值，开始线性降速，直到最小线速度min_approach_linear_velocity

      # —— 转向控制 ——
      use_rotate_to_heading: true              # 机器人航向与路径起点航向偏差过大（超过 rotate_to_heading_min_angle），或者在接近终点（在容差内）需要调整终态朝向时（rotate_to_heading_angular_vel调整速度），会停止线速度，进行原地旋转。对齐前瞻点方向
      rotate_to_heading_angular_vel: 0.35   # 原地旋转目标角速度；注意下游桥硬限幅 ±0.35/0.28，
                                           # 超过部分会被桥削掉，调大需同步改桥的 max_*_angular_z
      rotate_to_heading_min_angle: 0.785  #1.57  90度     0.785    45度
      # —— 碰撞检测（硬急停，与上面代价减速独立）——
      # 沿当前 (vx, ω) 向前仿真一条弧，弧长 = min(v × 本参数, 前瞻距离 carrot_dist)，
      # 弧上任何位姿 footprint 压到障碍 → 抛异常急停/恢复。RViz 看 /lookahead_collision_arc。
      # 水面惯量大、制动慢，时间窗宜 ≥ 3s；本参数×当前速度 = 实际检查距离（0.5m/s×5s=2.5m）还受carrot点距离的限制
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 20.0
      use_interpolation: true
      transform_tolerance: 0.2
      max_robot_pose_search_dist: 10.0
      
local_costmap:
  local_costmap:
    ros__parameters:
      # —— 更新/发布频率 (Hz)。点云密时 CPU 偏高可适当降低 ——
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      # —— 窗口尺寸 (米)：宽 20 × 高 20，分辨率 0.1 m/格 ——
      width: 20
      height: 20
      resolution: 0.1
      # —— 船体 footprint (米)：前向 2.72 / 后向 0.4 / 半宽 0.95（以 base_link 为原点）——
      footprint: "[[2.72, 0.95], [2.72, -0.95], [-0.4, -0.95], [-0.4, 0.95]]"
      plugins: ["voxel_layer", "inflation_layer"]
      # —— 膨胀层：在障碍物周围生成渐变代价。半径过大会让船绕行过远 ——
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # —— 代价衰减系数：1.0 ≈ 线性衰减；>1 衰减更快,机器人越敢贴障碍
        cost_scaling_factor: 1.0
        # —— 膨胀半径 (m)：从障碍格向外染色，RPP 代价减速能感知的最远距离 = 此值 ——
        #    须 ≥ RPP cost_scaling_dist（5.0），已对齐
        inflation_radius: 5.0
      # —— Voxel 层：将 3D 点云投影为 2D 障碍标记 ——
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        # —— 是否清空机器人 footprint 覆盖范围内的旧障碍标记（船体近距由本体遮挡/反光，清空更稳）——
        footprint_clearing_enabled: true
        # —— 发布体素网格 (RViz 可订阅 /local_costmap/voxel_grid 查看) ——调试时true,实船false
        publish_voxel_map: true
        # —— 体素 z 轴范围：origin_z=-0.3, z_res=0.2, z_voxels=12 → 覆盖 odom [-0.3, 2.1]。
        #    底边在水面(odom≈-0.25)稍下；顶边盖住观测源保留的最高点(2.1)，避免网格提前截断。 ——
        origin_z: -0.20      # odom z 区间：base_link≈0、水面≈-0.25、激光≈+0.36
        z_resolution: 0.1   # z 轴分辨率 (米/层)
        z_voxels: 12         # z 轴层数
        # —— 二次过滤上限 (m)：这是能实时调的「真正上限」，以 base_link(odom z=0) 往上计。
        #    观测源(livox_cloud.max_obstacle_height)已放宽到 2.1，本层才是卡点。
        #    默认 1.0 ≈ 船/障碍最高只比激光(≈+0.36)高一点；可在工具里在线调(0.8/1.0...)。
        #    注意：> 此值的点由本层直接跳过，不入体素格。 ——
        max_obstacle_height: 1.0
        # —— 标记阈值：一个体素列中至少 mark_threshold 个点被占据才标为障碍。0=首次点击即标记 (水面杂波多时可增大到 1~2) ——
        mark_threshold: 2
        # —— 体素列被判为 unknown 的点数阈值（源码默认 15，一般无需调整）——
        unknown_threshold: 15
        # —— 多层/多源叠加：1=max 取最大代价(推荐)；0=overwrite 直接覆盖 ——
        combination_method: 1
        observation_sources: livox_cloud
        livox_cloud:
          topic: /livox/lidar
          data_type: "PointCloud2"
          # —— 观测点保留时间：0=立即过期（动态环境建议 0，配合 clearing）——
          observation_persistence: 0.0
          # —— clearing: true → 射线穿过区域清除旧障碍 (动态环境需要) ——
          clearing: true
          marking: true
          # —— 障碍距离与高度过滤 ——
          obstacle_min_range: 2.0    # 盲区 (米)，小于此距离的点忽略
          # —— 最大检测距离 (m)：应 ≥ local 窗口半宽(20/2=10) 的对角半径≈14，取 20 覆盖整个 20×20 滚动窗口 ——
          obstacle_max_range: 20.0
          raytrace_min_range: 0.5
          # —— 射线清除最大距离 (m)：一般比 obstacle_max_range 大一点，清除射线需覆盖检测范围 ——
          raytrace_max_range: 22.0
          # —— 障碍高度筛选 (ObservationBuffer 裁剪，相对 odom z = 初始 base_link 位置) ——
          #    min 设 -0.25：水面(在初始 base_link 下方约 0.25 m，odom z≈-0.25)及其直反射点会被滤掉，
          #       避免水面反光产生 ghost；低于水面(吃水线以下)的点亦不入图。
          #    max 放宽为 2.1：观测源尽量保留，真正的上限交给 voxel_layer.max_obstacle_height(在线调)。
          min_obstacle_height: -0.25
          max_obstacle_height: 1.5
      always_send_full_costmap: true #稳定后改false
      
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: false
      # —— 船体 footprint：前向 2.72 / 后向 0.4 / 半宽 0.95（以 base_link 为原点），同 local ——
      footprint: "[[2.72, 0.95], [2.72, -0.95], [-0.4, -0.95], [-0.4, 0.95]]"
      # —— 全局代价地图分辨率 (m/格)。原则：全局代价地图分辨率 = 地图分辨率 ——
      resolution: 0.5
      track_unknown_space: True  #false，unknow会当成free
      # —— global 挂 voxel_layer 用于远距离障碍预判（obstacle_max_range 15m）。
      #    注意：非滚动窗口下，动态物（行人/车辆）离开后其标记可能残留（clearing 需要射线穿过旧体素，
      #    动态物走后无新射线穿过原位置则永久残留）。水上动态物少时影响不大；
      #    若岸测/码头出现大量 ghost，可临时删掉 voxel_layer 或设 enabled: false ——
      # —— keepout_filter 必须排在 inflation_layer 之前，膨胀才会覆盖禁行区边缘 ——
      plugins: ["static_layer", "keepout_filter", "voxel_layer", "inflation_layer"]
      # —— 禁行过滤层（作业区/禁止区/硬边界）——
      #    掩码由 zone_manager 节点动态发布（经纬度区域 → 栅格化），
      #    TRANSIENT_LOCAL，区域更新即时生效；未下发区域时掩码全自由，行为与原来一致
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        filter_info_topic: "/keepout_filter/costmap_filter_info"
        transform_tolerance: 0.1
      # —— Voxel 层（全局远距离） ——
      #    默认关闭(enabled: false)，仅作远距离障碍预判备胎。全局走 static_layer + keepout_filter 即可；
      #    若开启会引入动态物残留/水面 ghost(非滚动窗口下 clearing 需射线穿旧体素，水上难清除)。
      #    参数已与 local_costmap 对齐，将来如需启用可直接置 true。
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: false
        publish_voxel_map: false
        footprint_clearing_enabled: true
        origin_z: -0.2 #体素地图在z方向上的底面高度
        z_resolution: 0.2
        z_voxels: 12
        # —— 高度上限 (m)：与 local_costmap/livox_cloud 一致，滤高于 1.8 m 的点 ——
        max_obstacle_height: 1.8
        mark_threshold: 3
        unknown_threshold: 15
        combination_method: 1
        observation_sources: livox_cloud
        livox_cloud:
          topic: /livox/lidar
          data_type: "PointCloud2"
          clearing: true
          marking: true
          obstacle_min_range: 0.8
          # —— 全局远距离检测 (m)：global 非滚动，可调大以预判远处障碍 ——
          obstacle_max_range: 15.0
          raytrace_min_range: 0.8
          raytrace_max_range: 15.0
          # —— 高度筛选 (相对 odom z)：min=-0.25 滤水面反射，max=1.8 滤桥梁/树冠，与 local 一致 ——
          min_obstacle_height: -0.25
          max_obstacle_height: 1.8
          observation_persistence: 0.0
      # —— 静态地图层 ——
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # —— 膨胀层 ——
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        # —— 全局膨胀半径 (m)：规划器按 base_link 点搜索，此值≈船离静态障碍多远。
        #    船体外接半径 ≈ 2.88m，3.5m ≈ 船身 + 0.6m 余量；再大窄道会被高代价夹住绕行甚至无解 ——
        inflation_radius: 4.0
      always_send_full_costmap: True
      
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      # —— 路径终点容差 (m)。粗分辨率地图可适当加大 ——
      # 路径曲折会加剧 RPP 曲率检测；换图后若 S 线/画圈，同步查 global resolution 与 RPP min_radius
      tolerance: 2.0
      # —— 代价穿越乘数：>1 时规划器更倾向绕开代价区而非穿越。水面避障建议 2.0~3.0 ——
      cost_travel_multiplier: 3.0
      downsample_costmap: false
      downsampling_factor: 1
      # —— 允许穿越未知区域 (true=允许，false=只有已知空闲可走) ——
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      # —— 最大规划时间 (s)，超时则返回失败 ——
      max_planning_time: 3.0
      # —— 终点朝向策略(仅 SmacPlanner2D)：
      #    true  = 末端沿最后一段路径方向(切向)靠近，避免临近终点原地扭头；
      #    false = 终点姿态强制为 goal 朝向(适合要求精确纵/横对准的静态靠泊)。
      #    归港对准建议 true；若要终点必须等于 goal 朝向则改 false。 ——
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        # —— 平滑权重：w_smooth 越大路径越平滑但可能偏离原始路径；w_data 保持接近原始 ——
        w_smooth: 0.4
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        
        
# —— smoother_server —————————————————————————————————————————————————————————
# Nav2 平滑服务（SmoothPath action）。当前未启用：
#   - 不写 smoother_plugins → 用默认 simple_smoother（默认参数）；
#   - 默认导航 BT 不含 SmoothPath 节点，实际导航不会调用，等效关闭。
# 启用时取消下方注释；Humble 的 launch_ros 不支持空数组参数（smoother_plugins: [] 会报错）。
# 注意与 planner_server 的 GridBased.smoother 区分：那是 SmacPlanner 规划时的内部平滑。
# ————————————————————————————————————————————————————————————————————————————
smoother_server:
  ros__parameters:
    use_sim_time: false
    # 启用时取消注释：
    # smoother_plugins: ["simple_smoother"]
    # simple_smoother:
    #   plugin: "nav2_smoother::SimpleSmoother"
    #   tolerance: 1.0e-10
    #   max_its: 1000
    #   do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 1.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false

    # —— Spin 恢复行为参数（本 fork 无插件名前缀，直接挂 behavior_server 顶层）——
    simulate_ahead_time: 3.0
    # —— 旋转恢复速度限制 (rad/s) ——
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false  
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 50


# —— velocity_smoother ——————————————————————————————————————————————————————
# Nav2 bringup（navigation_launch.py）话题 remap：
#   controller_server  → /cmd_vel_nav
#   velocity_smoother  订阅 /cmd_vel_nav，发布 /cmd_vel
#
# 实船速度桥 ardupilot_velocity_bridge 订阅 /cmd_vel_nav（绕过本 smoother）。
# 改 RPP 的 desired_linear_vel 时，须同步 ardupilot_velocity_bridge 的 max_linear_x / max_angular_z。
# 若把桥输入改为 /cmd_vel，则以下限幅才会作用到飞控。
# ————————————————————————————————————————————————————————————————————————————
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    # —— 平滑频率 (Hz)，≥ controller_frequency ——
    smoothing_frequency: 20.0
    scale_velocities: true
    # 反馈模式：OPEN_LOOP 按目标速度直接平滑（不依赖 odom 闭环反馈，实船保持此模式）
    feedback: "OPEN_LOOP"

    # —— [vx, vy, wz] 速度/加速度限幅，水面惯量大取小值抑制 cmd_vel 抖动 ——
    max_velocity: [0.5, 0.0, 0.5]
    min_velocity: [0.0, 0.0, -0.5]
    # —— 加速度上限 ([ax, ay, awz])。水面惯量大，小值抑制 cmd_vel 抖动 ——
    max_accel: [0.5, 0.0, 0.5]
    max_decel: [-0.5, 0.0, -0.5]   # 减速度 (<0)

    odom_topic: "/mavros/gps_input/local"
    odom_duration: 0.1
    # —— 速度死区：低于此值输出 0 ——
    deadband_velocity: [0.02, 0.0, 0.02]
    velocity_timeout: 1.0
